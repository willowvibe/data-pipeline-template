<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>data-pipeline-template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --text: #162033;
    --muted: #52607a;
    --border: #d9e0ec;
    --accent: #1668dc;
    --accent-soft: #e4efff;
    --code: #101a2c;
    --code-text: #e6edf8;
    --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background:
      radial-gradient(1000px 480px at 92% 108%, var(--accent-soft), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    width: 1920px;
    height: 1080px;
    padding: 130px 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 0 0 34px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 54px;
    height: 4px;
    border-radius: 999px;
    background: var(--accent);
  }
  h1 {
    margin: 0;
    color: var(--text);
    font-size: 118px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.035em;
  }
  .code {
    margin: 54px 0 0;
    padding: 36px 44px;
    border-radius: 18px;
    background: var(--code);
    color: var(--code-text);
    font-family: var(--font-mono);
    font-size: 31px;
    font-weight: 400;
    line-height: 1.45;
    white-space: nowrap;
    box-shadow: 0 24px 60px rgba(16, 26, 44, 0.22);
  }
  .code .prompt {
    color: #8cc4ff;
  }
  .links {
    margin: 46px 0 0;
  }
  .links p {
    margin: 0 0 14px;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 31px;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .footer {
    margin: 70px 0 0;
    padding-top: 26px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 22px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">WillowVibe &middot; open-source template</p>
    <h1>Generate your own</h1>
    <pre class="code"><span class="prompt">$ </span>copier copy gh:willowvibe/data-pipeline-template my-pipeline</pre>
    <div class="links">
      <p>github.com/willowvibe/data-pipeline-template</p>
      <p>willowvibe.github.io/data-pipeline-template</p>
    </div>
    <p class="footer">MIT &middot; WillowVibe</p>
  </div>
</body>
</html>
