version: 2

models:
  - name: city_extremes
    description: Hottest, coldest and wettest day per city across the loaded range.
    columns:
      - name: city
        description: City name from the pipeline configuration.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('cities')
                field: name
      - name: hottest_date
        description: Date with the highest daily maximum temperature.
      - name: hottest_temperature_c
        description: Daily maximum temperature on the hottest date in degrees Celsius.
      - name: coldest_date
        description: Date with the lowest daily minimum temperature.
      - name: coldest_temperature_c
        description: Daily minimum temperature on the coldest date in degrees Celsius.
      - name: wettest_date
        description: Date with the most precipitation.
      - name: wettest_precipitation_mm
        description: Total precipitation on the wettest date in millimetres.
