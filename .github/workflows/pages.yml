name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install template tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build the site
        run: bash scripts/build_site.sh

      - name: Fetch demo video for inline playback
        run: |
          curl -fsSL --retry 3 -o _site/data-pipeline-template-demo.mp4 \
            https://github.com/willowvibe/data-pipeline-template/releases/download/v1.0.0/data-pipeline-template-demo.mp4
          test -s _site/data-pipeline-template-demo.mp4
          curl -fsSL --retry 3 -o _site/data-pipeline-template-demo-poster.jpg \
            https://github.com/willowvibe/data-pipeline-template/releases/download/v1.0.0/data-pipeline-template-demo-poster.jpg
          test -s _site/data-pipeline-template-demo-poster.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
