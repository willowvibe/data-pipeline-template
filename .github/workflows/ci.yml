name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install template tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Render shapes
        run: python -m pytest -q tests/test_render.py

  projects:
    runs-on: ubuntu-latest
    needs: render-tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        warehouse: [duckdb, postgres]
        orchestrator: [none, airflow]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install template tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check ${{ matrix.warehouse }} + ${{ matrix.orchestrator }}
        run: bash scripts/check.sh ${{ matrix.warehouse }} ${{ matrix.orchestrator }}

  airflow-stack:
    runs-on: ubuntu-latest
    needs: render-tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        warehouse: [duckdb, postgres]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install template tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check ${{ matrix.warehouse }} + airflow stack
        run: bash scripts/stack_check.sh ${{ matrix.warehouse }}
